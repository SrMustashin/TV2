
name: Compilar CleanYourTV TCL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/build-tcl.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permisos de Gradle
        run: chmod +x launcher/gradlew

      - name: Compilar launcher original
        working-directory: launcher
        run: ./gradlew assembleRelease --no-daemon --stacktrace --console=plain

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-TCL
          path: launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
